# Konfigurasi analisis SonarCloud untuk iledia-math.
# Ganti projectKey/organization bila memakai SonarQube self-hosted.
sonar.projectKey=vinjerdim_iledia-math
sonar.organization=vinjerdim
sonar.projectName=iLedia Math
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Sumber: halaman root, kode bersama, modul per fase, dan skrip build
sonar.sources=.
sonar.inclusions=index.html,shared/**,fase-*/**,scripts/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,sample/**,.husky/**,package-lock.json

# Tes unit (node --test) ada di tests/. Laporan coverage belum dibuat;
# saat tersedia, set sonar.javascript.lcov.reportPaths lalu hapus baris
# coverage.exclusions di bawah.
sonar.tests=tests
sonar.coverage.exclusions=**/*

# data.js berisi konten pembelajaran; index.html modul dihasilkan oleh
# scripts/build-pages.js dari template bersama — keduanya wajar mirip.
sonar.cpd.exclusions=fase-*/**/data.js,fase-*/**/index.html

# Modul berjalan di browser; scripts/ berjalan di Node (CommonJS)
sonar.javascript.environments=browser,node
