<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luas Permukaan Prisma — Matematika Fase D</title>
    <meta
      name="description"
      content="Media pembelajaran interaktif berbasis Discovery Learning untuk menentukan rumus luas permukaan prisma: Lab Bentang melipat–membuka jaring-jaring kemasan berukuran dan mengetuk setiap sisinya, kartu luas tiap sisi berdiagnosa, sabuk sisi tegak yang dirapatkan menjadi persegi panjang keliling alas × tinggi, kartu data tiga prisma, pembuktian dua cara, tanggapan miskonsepsi, dan uji terap kontekstual."
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="styles.css" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5WBP714SS0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-5WBP714SS0');
    </script>
  </head>

  <body>
    <a href="#konten-utama" class="skip-link">Lewati ke konten utama</a>

    <header class="app-header">
      <div class="app-header__brand">
        <span class="app-header__kicker">Matematika — Fase D (SMP)</span>
        <h1 class="app-header__title">Luas Permukaan Prisma</h1>
      </div>
      <div class="app-header__actions">
        <button type="button" id="resetAppBtn" class="btn btn--ghost btn--small">Reset</button>
        <a href="../../index.html" class="btn btn--ghost btn--small">Beranda</a>
      </div>
    </header>

    <nav class="stage-nav" aria-label="Tahapan pembelajaran">
      <ol class="stage-nav__list" id="stageNavList">
        <!-- Diisi oleh app.js -->
      </ol>
    </nav>

    <main id="konten-utama">
      <div class="progress-bar-wrap">
        <div class="progress-bar-label">
          <span id="progressLabel">0 dari 10 tahap selesai</span>
          <span style="font-size: 0.78rem; color: var(--color-ink-muted)">
            Progress disimpan otomatis
          </span>
        </div>
        <div
          class="progress-bar"
          role="progressbar"
          aria-label="Progress pembelajaran"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div class="progress-bar__fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>

      <div id="stageContainer">
        <p style="text-align: center; padding: var(--space-7); color: var(--color-ink-muted)">
          Memuat media pembelajaran…
        </p>
      </div>
    </main>

    <div class="app-notice" id="appNotice" role="status" aria-live="polite"></div>
    <!-- Reset confirmation modal -->
    <div
      class="modal-backdrop"
      id="resetModal"
      style="display: none"
      role="dialog"
      aria-modal="true"
      aria-labelledby="resetModalTitle"
    >
      <div class="modal">
        <h3 id="resetModalTitle">Reset Progress?</h3>
        <p>
          Semua progress, jawaban, dan data latihan akan dihapus. Tindakan ini tidak dapat
          dibatalkan.
        </p>
        <div class="btn-group btn-group--end">
          <button type="button" class="btn btn--ghost" id="resetCancelBtn">Batal</button>
          <button
            type="button"
            class="btn btn--primary"
            id="resetConfirmBtn"
            style="background: var(--color-error); border-color: var(--color-error)"
          >
            Ya, Reset
          </button>
        </div>
      </div>
    </div>

    <script src="../../shared/engine.js"></script>
    <script src="data.js"></script>

    <script src="app.js"></script>
  </body>
</html>
